replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  className: nginx
  host: deploy-tracker.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
