apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-tracker-api
  labels:
    app.kubernetes.io/name: deploy-tracker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deploy-tracker-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deploy-tracker-api
    spec:
      containers:
        - name: api
          image: ghcr.io/balori/deploy-tracker-api:latest
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: deploy-tracker-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
